<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CODEX</title>
<link rel="icon" type="image/png" href="Icons/CODEX - 48PX.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2d2b2e;
    --accent: #2e5266;
    --record: #e05252;
    --border: rgba(255, 255, 255, 0.12);
    --text-dim: rgba(255, 255, 255, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 360px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: #ffffff;
  }

  button { font-family: inherit; }

  .popup {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .brand img { width: 24px; height: 24px; object-fit: contain; }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8a8a8a;
    flex-shrink: 0;
  }

  .status-dot.active {
    background: var(--record);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .stat-box {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat-label { font-size: 13px; color: var(--text-dim); }
  .stat-value { font-size: 26px; font-weight: 600; }

  .btn-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
    background: var(--record);
  }

  .btn-main:hover { opacity: 0.9; }

  .btn-main.stop-review-btn { background: var(--accent); }

  body:not(.is-recording) .stop-review-btn { display: none; }
  body.is-recording .record-btn { display: none; }

  .row { display: flex; gap: 10px; }

  .btn-secondary {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-secondary:not(:disabled):hover { background: rgba(255, 255, 255, 0.12); }

  .btn-secondary.danger:not(:disabled):hover { background: rgba(224, 82, 82, 0.25); }

  .info-box {
    background: #cac8bc;
    color: #1e1e1e;
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 12px;
    line-height: 1.6;
  }

  .info-box strong { display: block; margin-bottom: 5px; font-size: 13px; }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    padding-top: 2px;
  }

  .footer a, .footer button.link {
    background: none;
    border: none;
    color: var(--text-dim);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
    padding: 0;
  }

  .footer a:hover, .footer button.link:hover { color: #ffffff; }
</style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="brand">
        <img src="Icons/CODEX - 48PX.png" alt="">
        <span>CODEX</span>
      </div>
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <div class="stat-box">
      <span class="stat-label">Steps captured</span>
      <span class="stat-value" id="stepCount">0</span>
    </div>

    <button class="btn-main record-btn" id="recordBtn" type="button">Record</button>
    <button class="btn-main stop-review-btn" id="stopReviewBtn" type="button">
      Stop &amp; Review — <span id="recStepCount">0 steps</span>
    </button>

    <div class="row">
      <button class="btn-secondary" id="reviewBtn" type="button" disabled>Review Steps</button>
      <button class="btn-secondary danger" id="clearBtn" type="button" disabled>Clear</button>
    </div>

    <div class="info-box">
      <strong>How it works</strong>
      Click Record, then interact with the page like normal — each click is captured. Click Stop &amp; Review when done, edit your SOP, and publish to CODEX.
    </div>

    <div class="footer">
      <a href="https://kpcodex-production.up.railway.app" target="_blank" rel="noopener">Sign in</a>
      <button class="link" id="viewSopsBtn" type="button">View SOPs</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
