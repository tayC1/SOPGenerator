<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      background: rgba(221, 228, 233, 1);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      color: rgba(30, 30, 30, 1);
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      background: rgba(46, 82, 102, 1);
      padding: 18px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: rgba(255, 255, 255, 1);
      letter-spacing: -0.3px;
    }

    .header-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 5px 12px 5px 9px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .status-dot.active {
      background: rgba(16, 185, 129, 1);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      letter-spacing: 0.1px;
    }

    /* ── Content area ────────────────────────────── */
    .content {
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Card ─────────────────────────────────────── */
    .card {
      background: rgba(255, 255, 255, 1);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }

    /* ── Step counter inside a card ───────────────── */
    .step-counter {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .step-counter-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(46, 82, 102, 0.6);
    }

    .step-counter-value {
      font-size: 20px;
      font-weight: 700;
      color: rgba(46, 82, 102, 1);
    }

    /* ── Primary action buttons ────────────────────── */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      font-family: Inter, sans-serif;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.15s;
    }

    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    button:not(:disabled):active {
      transform: scale(0.97);
    }

    .btn-primary {
      flex: 1;
      padding: 12px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 1);
      letter-spacing: 0.2px;
    }

    .btn-record {
      background: rgba(16, 185, 129, 1);
    }

    .btn-stop {
      background: rgba(200, 107, 102, 1);
    }

    /* ── Secondary / action buttons ───────────────── */
    .btn-secondary-row {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      padding: 11px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 1);
      letter-spacing: 0.1px;
    }

    .btn-review {
      background: rgba(46, 82, 102, 1);
    }

    .btn-clear {
      background: rgba(217, 217, 217, 1);
      color: rgba(80, 80, 80, 1);
    }

    /* ── Info card ────────────────────────────────── */
    .info-card {
      background: rgba(255, 255, 255, 1);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 14px 16px;
    }

    .info-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(46, 82, 102, 0.6);
      margin-bottom: 8px;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .info-list li {
      font-size: 13px;
      font-weight: 400;
      color: rgba(51, 65, 85, 1);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-list li::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(46, 82, 102, 0.45);
      flex-shrink: 0;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">SOP Generator</div>
      <div class="header-sub">Record workflow to documentation</div>
    </div>
    <div class="status-pill">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-label" id="statusText">Ready</span>
    </div>
  </div>

  <div class="content">

    <!-- Step counter -->
    <div class="card">
      <div class="step-counter">
        <span class="step-counter-label">Steps captured</span>
        <span class="step-counter-value" id="stepCount">0</span>
      </div>
    </div>

    <!-- Record / Stop -->
    <div class="btn-row">
      <button class="btn-primary btn-record" id="recordBtn">Record</button>
      <button class="btn-primary btn-stop" id="stopBtn" disabled>Stop</button>
    </div>

    <!-- Review / Clear -->
    <div class="btn-secondary-row">
      <button class="btn-secondary btn-review" id="reviewBtn" disabled>Review Steps</button>
      <button class="btn-secondary btn-clear" id="clearBtn" disabled>Clear</button>
    </div>

    <!-- How it works -->
    <div class="info-card">
      <div class="info-title">How it works</div>
      <ul class="info-list">
        <li>Click Record, then interact with the page</li>
        <li>Each click is captured with a screenshot</li>
        <li>Click Stop when done, then Review Steps</li>
        <li>Edit descriptions, reorder, and export</li>
      </ul>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
