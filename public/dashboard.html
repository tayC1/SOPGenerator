<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My SOPs — CODEX</title>
<link rel="icon" type="image/png" href="/icons/CODEX Favicon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CODEX">
<meta name="theme-color" content="#2d2b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #2d2b2e;
    --sidebar-bg: rgba(0, 0, 0, 0.24);
    --border: rgba(255, 255, 255, 0.12);
    --text-dim: rgba(255, 255, 255, 0.55);
    --text-faint: rgba(255, 255, 255, 0.35);
    --accent: #2e5266;
    --tag: #e96d2d;
    --card-bg: #cac8bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ffffff;
    min-height: 100vh;
  }

  a { color: inherit; }

  button { font-family: inherit; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; }

  /* ---------- layout ---------- */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 252px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    text-decoration: none;
    color: inherit;
  }

  .sidebar-brand img { width: 32px; height: 32px; object-fit: contain; }
  .sidebar-brand span { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 0 20px; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .nav-item[aria-disabled="true"] {
    cursor: not-allowed;
    color: var(--text-faint);
  }
  .nav-item[aria-disabled="true"]:hover { background: none; }

  .nav-soon {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 7px;
  }

  .sidebar-section-label {
    padding: 18px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }

  .category-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    cursor: pointer;
  }

  .category-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .category-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; font-weight: 500; }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .sidebar-footer:hover { background: rgba(255, 255, 255, 0.05); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .user-name { font-size: 14px; font-weight: 500; }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 36px 40px 56px;
    max-width: clamp(1280px, 90vw, 2200px);
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .page-title { font-size: 26px; font-weight: 600; }

  .btn-create {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  .btn-create:hover { opacity: 0.88; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: rgba(217, 217, 217, 0.08);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .stat-label { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .stat-value { font-size: 34px; font-weight: 600; line-height: 1; margin-bottom: 6px; }
  .stat-sub { font-size: 12px; color: var(--text-faint); }

  .toolbar { margin-bottom: 24px; }

  .search-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 420px;
  }

  .search-input-wrap .icon { color: rgba(0, 0, 0, 0.45); }

  .search-input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    color: #1e1e1e;
  }

  .section-heading {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .sop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }

  .sop-card {
    background: var(--card-bg);
    color: #1e1e1e;
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .pin-corner {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: none;
    background: rgba(45, 43, 46, 0.45);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .pin-corner:hover { background: rgba(45, 43, 46, 0.65); }
  .pin-corner.is-saved { color: var(--tag); }
  .pin-corner .icon { width: 14px; height: 14px; }

  .sop-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; padding-right: 50px; }

  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .tag-solid { background: var(--tag); color: #1e1e1e; }
  .tag-outline { border: 1px solid var(--tag); color: #2d2b2e; }

  .sop-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
  .sop-title a { color: inherit; text-decoration: none; }
  .sop-title a:hover { text-decoration: underline; }

  .sop-desc {
    font-size: 12px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 14px;
    flex: 1;
  }

  .sop-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    padding-top: 10px;
    margin-bottom: 12px;
  }

  .sop-author { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sop-author .avatar { width: 20px; height: 20px; font-size: 10px; background: #d4d4d4; color: #1e1e1e; }
  .sop-author span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sop-steps { flex-shrink: 0; color: var(--accent); font-weight: 600; }

  .sop-card-actions { display: flex; gap: 8px; }

  .action-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(45, 43, 46, 0.45);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    cursor: pointer;
  }

  .action-btn .icon { width: 12px; height: 12px; flex-shrink: 0; }
  .action-btn:hover { background: rgba(45, 43, 46, 0.65); }

  .action-btn-danger { color: #e08080; }
  .action-btn-danger:hover { background: rgba(224, 128, 128, 0.18); }


  .empty-state {
    text-align: center;
    color: var(--text-faint);
    padding: 60px 0;
    font-size: 14px;
  }

  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main { padding: 28px 20px 48px; }
  }
</style>
</head>

  <script>
    const ICONS = {
      eye: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
      edit: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
      download: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
      trash: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function initials(name) {
      const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts[1]?.[0] ?? '')).toUpperCase();
    }

    function formatDate(value) {
      if (!value) return '';
      return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    let allSops = [];
    // What's actually shown in the grid - equal to allSops with an empty
    // search box, or the server's search results once a term is typed (see
    // applySearch). Kept separate from allSops so renderStats() always
    // reflects the full set, never a filtered subset.
    let currentResults = [];
    let currentUser = null;

    // Owners can always delete their own SOPs. An admin may also delete
    // one within their scope: super_admin covers everything, department_admin
    // only SOPs categorized under a department they're currently in (an
    // uncategorized SOP has no department for them to be scoped over).
    function canDeleteSop(sop) {
      if (!currentUser) return false;
      if (sop.user_id === currentUser.id) return true;
      if (currentUser.role === 'super_admin') return true;
      if (currentUser.role === 'department_admin' && sop.category) {
        return (currentUser.departments || []).includes(sop.category);
      }
      return false;
    }

    // Same scoping rule as PATCH /sops/:id on the server - kept as a
    // separate name from canDeleteSop even though the logic is identical
    // today, since edit and delete permissions are conceptually distinct
    // and may diverge later.
    const canEditSop = canDeleteSop;

    // Chrome Web Store-assigned extension ID for the published listing, plus
    // the fixed dev ID that `npm run build:unpacked` bakes into its manifest
    // (see scripts/build-unpacked.js) so a local "Load unpacked" install is
    // also reachable. If the listing is ever republished under a different
    // keypair, the first literal must be updated to match.
    const EXTENSION_IDS = ['capicbafpiflgbopfcklobgdebodigmb', 'hjmljeciibdcngnbhganckgekhnoickn'];

    // Tries each known CODEX extension ID in turn and resolves with the
    // first one that actually responds. A user may have the Web Store
    // build, the self-hosted build, or a local dev build installed, and
    // chrome.runtime.sendMessage only targets one extension ID per call.
    //
    // Chrome-only: window.chrome (and externally_connectable, which is what
    // makes this callable at all) is a Chrome-specific browser surface -
    // Safari never exposes chrome.runtime to page scripts, so this resolves
    // {ok:false} immediately there and callers fall through to the
    // postMessage path below.
    function sendToExtensionDirect(message) {
      return new Promise((resolve) => {
        if (typeof chrome === 'undefined' || !chrome.runtime || !chrome.runtime.sendMessage) {
          resolve({ ok: false });
          return;
        }
        let i = 0;
        function tryNext() {
          if (i >= EXTENSION_IDS.length) {
            resolve({ ok: false });
            return;
          }
          chrome.runtime.sendMessage(EXTENSION_IDS[i++], message, (response) => {
            if (chrome.runtime.lastError || !response) {
              tryNext();
              return;
            }
            resolve({ ok: true, response });
          });
        }
        tryNext();
      });
    }

    // Fallback path (and Safari's only path): content.js listens on window
    // for a message carrying this envelope, relays it into its own
    // background script, and posts the response back the same way - see the
    // matching listener in extension/content.js. Resolves {ok:false} if
    // nothing answers within the timeout, i.e. no CODEX extension is
    // installed/reachable in this browser.
    let bridgeRequestCounter = 0;
    function sendToExtensionViaPostMessage(message) {
      return new Promise((resolve) => {
        const requestId = `codex-${Date.now()}-${bridgeRequestCounter++}`;
        const timeout = setTimeout(() => {
          window.removeEventListener('message', onMessage);
          resolve({ ok: false });
        }, 1500);

        function onMessage(event) {
          if (event.source !== window) return;
          const data = event.data;
          if (!data || data.source !== 'codex-extension' || data.requestId !== requestId) return;
          clearTimeout(timeout);
          window.removeEventListener('message', onMessage);
          if (data.error || !data.response) {
            resolve({ ok: false });
            return;
          }
          resolve({ ok: true, response: data.response });
        }
        window.addEventListener('message', onMessage);
        window.postMessage({ ...message, source: 'codex-web', requestId }, window.location.origin);
      });
    }

    async function sendToExtension(message) {
      const direct = await sendToExtensionDirect(message);
      if (direct.ok) return direct;
      return sendToExtensionViaPostMessage(message);
    }

    async function loadUser() {
      const footer = document.getElementById('sidebarFooter');
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.user) throw new Error('not signed in');
        document.getElementById('userName').textContent = data.user.name || 'Account';
        document.getElementById('userAvatar').textContent = initials(data.user.name);
        document.getElementById('adminLink').style.display = data.user.is_admin ? 'block' : 'none';
        footer.href = '/settings';
        currentUser = data.user;
        // loadSops() may have already rendered cards before currentUser was
        // known, which would hide delete buttons the caller is actually
        // entitled to - re-render now that permission info is in.
        renderGrid();
        return data.user;
      } catch (err) {
        console.error('[auth-bridge] /auth/me failed:', err);
        document.getElementById('userName').textContent = 'Sign In';
        document.getElementById('userAvatar').textContent = '?';
        footer.href = '/auth/google';
        return null;
      }
    }

    // Hands the signed-in session off to the CODEX extension, if installed,
    // so it can authenticate its own API calls with a Bearer token instead
    // of relying on a browser session cookie it has no access to.
    async function bridgeSessionToExtension(user) {
      if (!user) {
        console.log('[auth-bridge] no active session, skipping extension bridge');
        return;
      }
      try {
        const res = await fetch('/auth/extension-token', { method: 'POST', credentials: 'include' });
        if (!res.ok) throw new Error(`extension-token request failed: ${res.status}`);
        const { token } = await res.json();

        const { ok, response } = await sendToExtension({
          type: 'USER_SIGNED_IN',
          token,
          user: { id: user.id, name: user.name, email: user.email, is_admin: user.is_admin },
        });
        if (!ok) {
          // Expected if no CODEX extension is installed in this browser - not an error.
          console.log('[auth-bridge] no CODEX extension reachable');
          return;
        }
        // background.js always responds (even on failure), so a response
        // existing doesn't mean the sign-in was actually stored - check
        // the flag it sends rather than treating any reply as success.
        if (!response.received) {
          console.error('[auth-bridge] extension rejected sign-in:', response.error);
          return;
        }
        console.log('[auth-bridge] extension acknowledged sign-in:', response);
      } catch (err) {
        console.error('[auth-bridge] failed to bridge session to extension:', err);
      }
    }

    function sopCardHtml(sop) {
      const category = sop.category || 'Uncategorized';
      const isDocument = sop.doc_type === 'document';
      const stepCount = Array.isArray(sop.steps) ? sop.steps.length : (sop.step_count ?? null);
      return `
        <article class="sop-card">
          <button class="pin-corner${CodexSaved.isSaved(sop.id) ? ' is-saved' : ''}" type="button" data-pin="${sop.id}" title="${CodexSaved.isSaved(sop.id) ? 'Remove from Saved' : 'Save'}" aria-label="${CodexSaved.isSaved(sop.id) ? 'Remove from Saved' : 'Save'}">${CodexSaved.icon(sop.id)}</button>
          <div class="sop-tags">
            <span class="tag tag-solid">${escapeHtml(category)}</span>
            <span class="tag tag-outline">${isDocument ? 'Document' : 'SOP'}</span>
            ${sop.tag ? `<span class="tag tag-outline">${escapeHtml(sop.tag)}</span>` : ''}
          </div>
          <h2 class="sop-title"><a href="/sop.html?id=${sop.id}">${escapeHtml(sop.title)}</a></h2>
          <p class="sop-desc">${escapeHtml(sop.description || 'No description provided.')}</p>
          <div class="sop-meta">
            <div class="sop-author">
              <span class="avatar">${escapeHtml(initials(sop.author))}</span>
              <span>${escapeHtml(sop.author || 'Unknown')} · ${formatDate(sop.created_at)}</span>
            </div>
            ${!isDocument && stepCount != null ? `<span class="sop-steps">${stepCount} step${stepCount === 1 ? '' : 's'}</span>` : ''}
          </div>
          <div class="sop-card-actions">
            <a class="action-btn" href="/sop.html?id=${sop.id}">${ICONS.eye} VIEW</a>
            ${canEditSop(sop)
              ? (isDocument
                ? `<a class="action-btn" href="/documents/new?id=${sop.id}">${ICONS.edit} EDIT</a>`
                : `<button class="action-btn" type="button" data-edit="${sop.id}">${ICONS.edit} EDIT</button>`)
              : ''}
            <button class="action-btn" type="button" data-export="${sop.id}">${ICONS.download} EXPORT</button>
            ${canDeleteSop(sop) ? `<button class="action-btn action-btn-danger" type="button" data-delete="${sop.id}">${ICONS.trash} DELETE</button>` : ''}
          </div>
        </article>
      `;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');

      if (currentResults.length === 0) {
        grid.innerHTML = '<p class="empty-state">No SOPs match your search yet.</p>';
        return;
      }

      grid.innerHTML = `<div class="sop-grid">${currentResults.map(sopCardHtml).join('')}</div>`;

      grid.querySelectorAll('[data-export]').forEach((btn) => {
        btn.addEventListener('click', () => exportSop(btn.dataset.export));
      });
      grid.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => editSop(btn.dataset.edit));
      });
      grid.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteSop(btn));
      });
      grid.querySelectorAll('[data-pin]').forEach((btn) => {
        btn.addEventListener('click', () => togglePin(btn));
      });
    }

    async function togglePin(btn) {
      const id = btn.dataset.pin;
      btn.disabled = true;
      try {
        const saved = await CodexSaved.toggle(id);
        btn.classList.toggle('is-saved', saved);
        btn.innerHTML = CodexSaved.icon(id);
        btn.title = saved ? 'Remove from Saved' : 'Save';
        btn.setAttribute('aria-label', btn.title);
      } catch {
        alert('Could not update the saved state right now.');
      } finally {
        btn.disabled = false;
      }
    }

    function renderStats() {
      const total = allSops.length;
      const categories = new Set(allSops.map((s) => s.category || 'Uncategorized'));
      const now = new Date();
      const addedThisMonth = allSops.filter((s) => {
        if (!s.created_at) return false;
        const d = new Date(s.created_at);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statTotalSub').textContent = `${addedThisMonth} added this month`;
      document.getElementById('statCategories').textContent = total === 0 ? 0 : categories.size;
      document.getElementById('statMonth').textContent = addedThisMonth;
    }

    async function exportSop(id) {
      try {
        const res = await fetch(`/sops/${id}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Not found');
        const sop = await res.json();
        const blob = new Blob([JSON.stringify(sop, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${(sop.title || 'sop').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } catch {
        alert('Could not export this SOP right now.');
      }
    }

    async function editSop(id) {
      try {
        const res = await fetch(`/sops/${id}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Not found');
        const sop = await res.json();
        const { ok, response } = await sendToExtension({ type: 'EDIT_SOP', sop });
        if (!ok) {
          // No CODEX extension installed/reachable in this browser (neither
          // the direct nor postMessage path got a response) - fall back to
          // the web-based manual step editor instead of dead-ending.
          console.log('[edit] no CODEX extension reachable, falling back to web editor');
          location.href = `/documents/new?id=${id}`;
          return;
        }
        if (!response.received) {
          console.error('[edit] extension did not accept EDIT_SOP:', response);
          alert(`Could not open this SOP for editing: ${response.error || 'unknown error'}`);
        }
      } catch {
        alert('Could not open this SOP for editing right now.');
      }
    }

    // Two-click confirm (armed state) instead of window.confirm() - same
    // pattern used elsewhere in the app for destructive actions.
    async function deleteSop(btn) {
      const id = btn.dataset.delete;
      if (btn.dataset.armed !== 'true') {
        btn.dataset.armed = 'true';
        btn.innerHTML = `${ICONS.trash} CONFIRM?`;
        setTimeout(() => {
          if (btn.isConnected && btn.dataset.armed === 'true') {
            btn.dataset.armed = 'false';
            btn.innerHTML = `${ICONS.trash} DELETE`;
          }
        }, 3000);
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch(`/sops/${id}`, { method: 'DELETE', credentials: 'include' });
        if (!res.ok) throw new Error((await res.json()).error || 'Delete failed');
        allSops = allSops.filter((sop) => String(sop.id) !== String(id));
        currentResults = currentResults.filter((sop) => String(sop.id) !== String(id));
        renderStats();
        renderGrid();
      } catch (err) {
        btn.disabled = false;
        btn.dataset.armed = 'false';
        btn.innerHTML = `${ICONS.trash} DELETE`;
        alert(err.message);
      }
    }

    async function loadSops() {
      const grid = document.getElementById('grid');
      try {
        const [res] = await Promise.all([
          fetch('/sops', { credentials: 'include' }),
          CodexSaved.load(),
        ]);
        if (!res.ok) throw new Error('Failed to load');
        allSops = await res.json();
        currentResults = allSops;
        renderStats();
        renderGrid();
      } catch {
        grid.innerHTML = '<p class="empty-state">Failed to load your SOPs.</p>';
      }
    }

    function debounce(fn, ms) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    // Real search: hits the backend so title/description/content/tag are
    // all matched (a client-side filter can't see content/tag - they're not
    // in the list payload). An empty term just restores the already-loaded
    // full list with no network round-trip.
    let searchRequestId = 0;
    async function applySearch() {
      const term = document.getElementById('searchInput').value.trim();
      if (!term) {
        currentResults = allSops;
        renderGrid();
        return;
      }

      const requestId = ++searchRequestId;
      try {
        const res = await fetch(`/sops?q=${encodeURIComponent(term)}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Search failed');
        const results = await res.json();
        // A slower earlier request can resolve after a newer one - ignore
        // it so the grid always reflects the latest keystroke, not a stale one.
        if (requestId !== searchRequestId) return;
        currentResults = results;
        renderGrid();
      } catch {
        if (requestId !== searchRequestId) return;
        document.getElementById('grid').innerHTML = '<p class="empty-state">Search failed. Try again.</p>';
      }
    }

    async function loadSidebarCategories() {
      const categoryList = document.getElementById('categoryList');
      if (!categoryList) return;
      try {
        const res = await fetch('/departments');
        if (!res.ok) throw new Error('Failed to load departments');
        const departments = await res.json();
        categoryList.innerHTML = departments.map((d) => `<a class="category-item" href="/team/${encodeURIComponent(d.name)}">${escapeHtml(d.name)}</a>`).join('');
      } catch (err) {
        console.error('[sidebar] failed to load categories:', err);
      }
    }

    document.getElementById('searchInput').addEventListener('input', debounce(applySearch, 250));

    loadUser().then(bridgeSessionToExtension);
    loadSops();
    loadSidebarCategories();
  </script>
</body>
</html>
