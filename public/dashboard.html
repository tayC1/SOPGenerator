<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CODEX</title>
  <link rel="icon" type="image/png" href="/icons/CODEX - 48PX.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #0f1923;
      color: #fff;
      min-height: 100vh;
      padding: 48px 24px;
    }
    header {
      max-width: 800px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 28px; font-weight: 800; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    #user-name { font-size: 14px; color: rgba(255,255,255,0.55); }
    a.logout {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
    }
    a.logout:hover { color: #fff; }
    #grid {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .card p { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 14px; line-height: 1.5; }
    .card-actions { display: flex; gap: 10px; }
    .card-actions a {
      font-size: 13px;
      font-weight: 600;
      color: #7eb8d4;
      text-decoration: none;
    }
    .card-actions a:hover { text-decoration: underline; }
    .btn-delete {
      font-size: 13px;
      font-weight: 600;
      color: #e07070;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .btn-delete:hover { text-decoration: underline; }
    .empty { text-align: center; color: rgba(255,255,255,0.4); margin-top: 80px; font-size: 15px; }
    #connect-section {
      max-width: 800px;
      margin: 0 auto 32px;
    }
    .connect-card {
      background: rgba(234,120,60,0.1);
      border: 1px solid rgba(234,120,60,0.28);
      border-radius: 14px;
      padding: 24px 26px;
    }
    .connect-card h2 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #fff;
    }
    .connect-instructions {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .token-box-row { display: flex; gap: 10px; margin-bottom: 10px; }
    #token-value {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: text;
      min-width: 0;
    }
    #copy-btn {
      background: rgba(234,120,60,1);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #copy-btn:hover { opacity: 0.88; }
    #refresh-token-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.38);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      text-decoration: underline;
    }
    #refresh-token-btn:hover { color: rgba(255,255,255,0.65); }
  </style>
</head>
<body>
  <header>
    <h1>My SOPs</h1>
    <div class="header-right">
      <span id="user-name"></span>
      <a class="logout" id="logout-link" href="/auth/logout">Sign out</a>
    </div>
  </header>
  <div id="connect-section">
    <div class="connect-card">
      <h2>Connect the CODEX extension</h2>
      <p class="connect-instructions">Sign in above, then paste this token into the CODEX extension popup.</p>
      <div class="token-box-row">
        <input id="token-value" type="text" readonly placeholder="Loading…">
        <button id="copy-btn">Copy</button>
      </div>
      <button id="refresh-token-btn">Generate new token</button>
    </div>
  </div>

  <div id="grid"></div>

  <script>
    function escape(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function deleteSop(id) {
      if (!confirm('Delete this SOP?')) return;
      await fetch(`/sops/${id}`, { method: 'DELETE' });
      load();
    }

    async function load() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/sops');
        const sops = await res.json();
        if (!sops.length) {
          grid.innerHTML = '<p class="empty">No SOPs yet — export one from the extension.</p>';
          return;
        }
        grid.innerHTML = sops.map(s => `
          <div class="card">
            <h2>${escape(s.title)}</h2>
            <p>${escape(s.description || '')}</p>
            <div class="card-actions">
              <a href="/sop.html?id=${s.id}">View →</a>
              <button class="btn-delete" onclick="deleteSop(${s.id})">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        grid.innerHTML = '<p class="empty">Failed to load SOPs.</p>';
      }
    }

    let currentToken = null;

    async function copyToken() {
      if (!currentToken) return;
      await navigator.clipboard.writeText(currentToken);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    }

    async function refreshToken() {
      if (!confirm('Generate a new token? Your current token will stop working.')) return;
      const res = await fetch('/auth/extension-token', { method: 'POST' });
      const { token } = await res.json();
      currentToken = token;
      document.getElementById('token-value').value = token;
    }

    async function init() {
      const res = await fetch('/auth/me');
      const { user } = await res.json();
      if (!user) {
        window.location.href = '/';
        return;
      }
      document.getElementById('user-name').textContent = user.name || user.email;

      currentToken = user.extension_token;
      document.getElementById('token-value').value = currentToken || '';
      document.getElementById('copy-btn').addEventListener('click', copyToken);
      document.getElementById('refresh-token-btn').addEventListener('click', refreshToken);

      if (typeof chrome !== 'undefined' && chrome.runtime) {
        chrome.runtime.sendMessage(
          'dagnjdffiejgocifggmpncekpfhcfddl',
          { type: 'USER_SIGNED_IN', user: { name: user.name, email: user.email, id: user.id } },
          (response) => { console.log('Extension notified', response); }
        );
      }

      document.getElementById('logout-link').addEventListener('click', (e) => {
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          e.preventDefault();
          chrome.runtime.sendMessage(
            'dagnjdffiejgocifggmpncekpfhcfddl',
            { type: 'USER_SIGNED_OUT' },
            () => { window.location.href = '/auth/logout'; }
          );
        }
      });

      load();
    }

    init();
  </script>
</body>
</html>
