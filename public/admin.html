<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — CODEX</title>
<link rel="icon" type="image/png" href="/icons/CODEX Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2d2b2e;
    --sidebar-bg: rgba(0, 0, 0, 0.24);
    --border: rgba(255, 255, 255, 0.12);
    --text-dim: rgba(255, 255, 255, 0.55);
    --text-faint: rgba(255, 255, 255, 0.35);
    --accent: #2e5266;
    --tag: #e96d2d;
    --card-bg: #cac8bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ffffff;
    min-height: 100vh;
  }

  a { color: inherit; }
  button, input, textarea { font-family: inherit; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; }

  /* ---------- layout ---------- */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 252px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    text-decoration: none;
    color: inherit;
  }

  .sidebar-brand img { width: 32px; height: 32px; object-fit: contain; }
  .sidebar-brand span { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 0 20px; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .nav-item[aria-disabled="true"] {
    cursor: not-allowed;
    color: var(--text-faint);
  }
  .nav-item[aria-disabled="true"]:hover { background: none; }

  .nav-soon {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 7px;
  }

  .sidebar-section-label {
    padding: 18px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }

  .category-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    cursor: pointer;
  }

  .category-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .category-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; font-weight: 500; }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .sidebar-footer:hover { background: rgba(255, 255, 255, 0.05); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .user-name { font-size: 14px; font-weight: 500; }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 36px 40px 56px;
    max-width: 1100px;
  }

  .page-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .page-subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 36px; }

  .section { margin-bottom: 44px; }

  .section-heading {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }

  /* users table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; font-size: 13px; }
  th { color: var(--text-faint); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.05em; white-space: nowrap; }
  tbody tr { border-top: 1px solid var(--border); }
  td .email { color: var(--text-dim); font-size: 12px; }

  .dir-fields { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
  .dir-phone-row { display: flex; gap: 4px; }
  .dir-phone-row .dir-input[data-field="phone"] { flex: 2; }
  .dir-phone-row .dir-input[data-field="extension"] { flex: 1; min-width: 0; }
  .dir-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .dir-input:focus { outline: 1.5px solid var(--accent); }
  .dir-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .dept-checkboxes { display: flex; flex-wrap: wrap; gap: 6px 14px; }

  .dept-checkbox {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    white-space: nowrap;
  }

  .dept-checkbox input { cursor: pointer; }

  .save-state { font-size: 11.5px; color: var(--text-faint); margin-left: 8px; }
  .save-state.ok { color: #7fc98f; }
  .save-state.err { color: #e08080; }

  .admin-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.8);
    cursor: pointer;
    white-space: nowrap;
  }
  .admin-toggle input { cursor: pointer; }
  .admin-toggle.disabled { color: var(--text-faint); cursor: not-allowed; }

  .badge-role {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--tag);
    background: rgba(233, 109, 45, 0.15);
    border-radius: 4px;
    padding: 2px 7px;
  }

  .badge-deactivated {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    color: #e08080;
    background: rgba(224, 128, 128, 0.15);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 3px;
  }

  tr.deactivated-row { opacity: 0.6; }

  .btn-remove, .btn-reactivate {
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-remove { background: rgba(224, 128, 128, 0.18); color: #e08080; }
  .btn-remove:hover { background: rgba(224, 128, 128, 0.3); }
  .btn-reactivate { background: rgba(127, 201, 143, 0.18); color: #7fc98f; }
  .btn-reactivate:hover { background: rgba(127, 201, 143, 0.3); }
  .btn-remove:disabled, .btn-reactivate:disabled { opacity: 0.6; cursor: default; }

  /* department cards */
  .dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }

  .dept-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }

  .field { margin-bottom: 12px; }

  .field label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }

  .field input[type="text"], .field textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    resize: vertical;
  }

  .field input:focus, .field textarea:focus { outline: 1.5px solid var(--accent); }

  .links-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

  .link-row { display: flex; gap: 6px; }
  .link-row input { flex: 1; min-width: 0; }
  .link-row .remove-link {
    background: rgba(224, 128, 128, 0.18);
    border: none;
    color: #e08080;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .link-row .remove-link:hover { background: rgba(224, 128, 128, 0.3); }

  .btn-add-link {
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    width: 100%;
  }
  .btn-add-link:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }

  .dept-footer { display: flex; align-items: center; margin-top: 14px; }

  .btn-save {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-save:hover { opacity: 0.88; }

  .empty-state, .denied {
    margin: 60px auto;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
  }

  .denied a { color: #7eb8d4; text-decoration: underline; }

  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main { padding: 28px 20px 48px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-brand" href="/">
        <img src="/icons/CODEX - 48PX.png" alt="">
        <span>CODEX</span>
      </a>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          Dashboard
        </a>
        <a class="nav-item" href="/saved">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          </span>
          Saved
        </a>
        <a class="nav-item" href="/contacts">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          Contacts
        </a>
      </nav>

      <div class="sidebar-section-label">Categories</div>
      <nav class="category-list" id="categoryList" aria-label="Categories">
        <a class="category-item" href="/team/Finance">Finance</a>
        <a class="category-item" href="/team/HR">HR</a>
        <a class="category-item" href="/team/Internal%20Ops">Internal Ops</a>
        <a class="category-item" href="/team/Logistics%2FPurchasing">Logistics/Purchasing</a>
        <a class="category-item" href="/team/Live%20Events%2FRentals">Live Events/Rentals</a>
        <a class="category-item" href="/team/Integrations%2FSales">Integrations/Sales</a>
      </nav>

      <a class="sidebar-footer" href="/settings" id="sidebarFooter">
        <div class="avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">Loading…</span>
      </a>
    </aside>

    <main class="main" id="main">
      <p class="empty-state">Checking access…</p>
    </main>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function initials(name) {
      const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts[1]?.[0] ?? '')).toUpperCase();
    }

    let departments = [];
    let currentUser = null;

    async function loadDepartments() {
      const res = await fetch('/admin/departments', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to load departments');
      departments = await res.json();
    }

    function userRowHtml(user) {
      const userDepartments = Array.isArray(user.departments) ? user.departments : [];
      const isDeactivated = user.is_active === false;
      const isSelf = String(user.id) === String(currentUser?.id);

      const checkboxes = departments.map((d) => `
        <label class="dept-checkbox">
          <input type="checkbox" value="${escapeHtml(d.name)}"${userDepartments.includes(d.name) ? ' checked' : ''}${isDeactivated ? ' disabled' : ''}>
          ${escapeHtml(d.name)}
        </label>
      `).join('');

      let adminCell;
      if (user.role === 'super_admin') {
        adminCell = '<span class="badge-role">Super Admin</span>';
      } else {
        const isAdmin = user.role === 'department_admin';
        // Scope-coupling: a member with zero departments has nothing to be
        // scoped over, so promoting them is disabled until they're assigned one.
        const disabled = isDeactivated || (!isAdmin && userDepartments.length === 0);
        adminCell = `
          <label class="admin-toggle${disabled ? ' disabled' : ''}">
            <input type="checkbox" class="admin-toggle-input" data-user-id="${user.id}"${isAdmin ? ' checked' : ''}${disabled ? ' disabled' : ''}>
            Is Admin
          </label>
          <span class="save-state" id="admin-msg-${user.id}"></span>
        `;
      }

      let actionCell;
      if (isDeactivated) {
        actionCell = `<button type="button" class="btn-reactivate" data-user-id="${user.id}">Reactivate</button>`;
      } else if (isSelf || (user.role !== 'member' && currentUser?.role !== 'super_admin')) {
        actionCell = '';
      } else {
        actionCell = `<button type="button" class="btn-remove" data-user-id="${user.id}">Remove</button>`;
      }

      // A department_admin can only edit directory info (title/phone/Slack)
      // for someone who currently shares a department with them - matches
      // the server-side check in PATCH /users/:id.
      const canEditDirectory = currentUser?.role === 'super_admin'
        || (currentUser?.role === 'department_admin' && userDepartments.some((d) => (currentUser.departments || []).includes(d)));
      const dirDisabled = isDeactivated || !canEditDirectory;

      return `
        <tr${isDeactivated ? ' class="deactivated-row"' : ''}>
          <td>${escapeHtml(user.name || 'Unknown')}<br><span class="email">${escapeHtml(user.email)}</span>${isDeactivated ? '<br><span class="badge-deactivated">Deactivated</span>' : ''}</td>
          <td>
            <div class="dept-checkboxes" data-user-id="${user.id}">${checkboxes}</div>
            <span class="save-state" id="save-state-${user.id}"></span>
          </td>
          <td>
            <div class="dir-fields" data-user-id="${user.id}">
              <input type="text" class="dir-input" data-field="title" placeholder="Title" value="${escapeHtml(user.title)}"${dirDisabled ? ' disabled' : ''}>
              <div class="dir-phone-row">
                <input type="text" class="dir-input" data-field="phone" placeholder="Phone" value="${escapeHtml(user.phone)}"${dirDisabled ? ' disabled' : ''}>
                <input type="text" class="dir-input" data-field="extension" placeholder="Ext." value="${escapeHtml(user.extension)}"${dirDisabled ? ' disabled' : ''}>
              </div>
              <input type="text" class="dir-input" data-field="slack_url" placeholder="Slack profile link" value="${escapeHtml(user.slack_url)}"${dirDisabled ? ' disabled' : ''}>
            </div>
            <span class="save-state" id="dir-state-${user.id}"></span>
          </td>
          <td>${adminCell}</td>
          <td>
            ${actionCell}
            <span class="save-state" id="action-msg-${user.id}"></span>
          </td>
        </tr>
      `;
    }

    async function loadUsers() {
      const res = await fetch('/admin/users', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to load users');
      const users = await res.json();

      const tbody = document.getElementById('usersTbody');
      tbody.innerHTML = users.map(userRowHtml).join('');

      tbody.querySelectorAll('.dept-checkboxes').forEach((container) => {
        container.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
          checkbox.addEventListener('change', () => saveUserDepartments(container));
        });
      });

      tbody.querySelectorAll('.dir-fields').forEach((container) => {
        container.querySelectorAll('.dir-input').forEach((input) => {
          input.addEventListener('blur', () => saveDirectoryField(input));
        });
      });

      tbody.querySelectorAll('.admin-toggle-input').forEach((toggle) => {
        toggle.addEventListener('change', () => toggleUserAdmin(toggle));
      });

      tbody.querySelectorAll('.btn-remove').forEach((btn) => {
        btn.addEventListener('click', () => removeUser(btn));
      });

      tbody.querySelectorAll('.btn-reactivate').forEach((btn) => {
        btn.addEventListener('click', () => reactivateUser(btn));
      });
    }

    async function saveUserDepartments(container) {
      const userId = container.dataset.userId;
      const stateEl = document.getElementById(`save-state-${userId}`);
      const selected = [...container.querySelectorAll('input[type="checkbox"]:checked')].map((cb) => cb.value);

      stateEl.textContent = 'Saving…';
      stateEl.className = 'save-state';
      try {
        const res = await fetch(`/users/${userId}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ departments: selected }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
        stateEl.textContent = 'Saved ✓';
        stateEl.className = 'save-state ok';
        // Removing a department can auto-demote an admin (scope-coupling) -
        // refresh the row so the Is Admin toggle reflects that.
        await loadUsers();
      } catch (err) {
        stateEl.textContent = err.message;
        stateEl.className = 'save-state err';
      }
    }

    // Saves on blur (rather than a per-row Save button) since each cell
    // holds three independent fields - only sends the one field that
    // actually changed, so an admin without scope over every field can't
    // accidentally be blocked from saving the ones they do have scope over.
    async function saveDirectoryField(input) {
      const container = input.closest('.dir-fields');
      const userId = container.dataset.userId;
      const field = input.dataset.field;
      const previousValue = input.dataset.savedValue ?? input.defaultValue;
      const value = input.value.trim();
      if (value === previousValue) return;

      const stateEl = document.getElementById(`dir-state-${userId}`);
      stateEl.textContent = 'Saving…';
      stateEl.className = 'save-state';
      try {
        const res = await fetch(`/users/${userId}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [field]: value }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
        input.dataset.savedValue = value;
        stateEl.textContent = 'Saved ✓';
        stateEl.className = 'save-state ok';
      } catch (err) {
        input.value = previousValue;
        stateEl.textContent = err.message;
        stateEl.className = 'save-state err';
      }
    }

    async function toggleUserAdmin(toggle) {
      const userId = toggle.dataset.userId;
      const makeAdmin = toggle.checked;
      const msgEl = document.getElementById(`admin-msg-${userId}`);
      toggle.disabled = true;
      msgEl.textContent = 'Saving…';
      msgEl.className = 'save-state';
      try {
        const res = await fetch(`/users/${userId}/role`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isAdmin: makeAdmin }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Failed to update admin status');
        await loadUsers();
      } catch (err) {
        toggle.checked = !makeAdmin;
        toggle.disabled = false;
        msgEl.textContent = err.message;
        msgEl.className = 'save-state err';
      }
    }

    // Two-click confirm (armed state) instead of window.confirm() - same
    // pattern the extension popup uses, kept consistent here for a
    // destructive action even though this page isn't under that restriction.
    async function removeUser(btn) {
      const userId = btn.dataset.userId;
      if (btn.dataset.armed !== 'true') {
        btn.dataset.armed = 'true';
        btn.textContent = 'Confirm remove?';
        setTimeout(() => {
          if (btn.isConnected && btn.dataset.armed === 'true') {
            btn.dataset.armed = 'false';
            btn.textContent = 'Remove';
          }
        }, 3000);
        return;
      }

      const msgEl = document.getElementById(`action-msg-${userId}`);
      btn.disabled = true;
      msgEl.textContent = 'Removing…';
      msgEl.className = 'save-state';
      try {
        const res = await fetch(`/users/${userId}/deactivate`, { method: 'POST', credentials: 'include' });
        if (!res.ok) throw new Error((await res.json()).error || 'Failed to remove user');
        await loadUsers();
      } catch (err) {
        btn.disabled = false;
        btn.dataset.armed = 'false';
        btn.textContent = 'Remove';
        msgEl.textContent = err.message;
        msgEl.className = 'save-state err';
      }
    }

    async function reactivateUser(btn) {
      const userId = btn.dataset.userId;
      const msgEl = document.getElementById(`action-msg-${userId}`);
      btn.disabled = true;
      msgEl.textContent = 'Reactivating…';
      msgEl.className = 'save-state';
      try {
        const res = await fetch(`/users/${userId}/reactivate`, { method: 'POST', credentials: 'include' });
        if (!res.ok) throw new Error((await res.json()).error || 'Failed to reactivate user');
        await loadUsers();
      } catch (err) {
        btn.disabled = false;
        msgEl.textContent = err.message;
        msgEl.className = 'save-state err';
      }
    }

    function linkRowHtml(link) {
      return `
        <div class="link-row">
          <input type="text" class="link-label" placeholder="Label (e.g. Ramp)" value="${escapeHtml(link?.label)}">
          <input type="text" class="link-url" placeholder="https://…" value="${escapeHtml(link?.url)}">
          <button type="button" class="remove-link" title="Remove">&times;</button>
        </div>
      `;
    }

    function deptCardHtml(dept) {
      const links = Array.isArray(dept.links) ? dept.links : [];
      return `
        <div class="card dept-card" data-dept-id="${dept.id}">
          <h3>${escapeHtml(dept.name)}</h3>

          <div class="field">
            <label>Team Lead</label>
            <input type="text" class="dept-lead" placeholder="Unassigned" value="${escapeHtml(dept.lead)}">
          </div>

          <div class="field">
            <label>Description</label>
            <textarea class="dept-description" rows="3" placeholder="What this team does…">${escapeHtml(dept.description)}</textarea>
          </div>

          <div class="field">
            <label>Important Links</label>
            <div class="links-list">${links.map(linkRowHtml).join('')}</div>
            <button type="button" class="btn-add-link">+ Add Link</button>
          </div>

          <div class="dept-footer">
            <button type="button" class="btn-save">Save</button>
            <span class="save-state" id="dept-save-state-${dept.id}"></span>
          </div>
        </div>
      `;
    }

    function renderDepartments() {
      const grid = document.getElementById('deptGrid');
      grid.innerHTML = departments.map(deptCardHtml).join('');

      grid.querySelectorAll('.dept-card').forEach((card) => {
        card.querySelector('.btn-add-link').addEventListener('click', () => {
          card.querySelector('.links-list').insertAdjacentHTML('beforeend', linkRowHtml({}));
          wireRemoveButtons(card);
        });
        wireRemoveButtons(card);
        card.querySelector('.btn-save').addEventListener('click', () => saveDepartment(card));
      });
    }

    function wireRemoveButtons(card) {
      card.querySelectorAll('.remove-link').forEach((btn) => {
        btn.onclick = () => btn.closest('.link-row').remove();
      });
    }

    // A bare "app.ramp.com" has no scheme, so a browser resolves it as a
    // path relative to whatever page it's clicked from instead of treating
    // it as an external site - assume https:// unless a scheme is already
    // present (http:, mailto:, etc.).
    function normalizeUrl(url) {
      const trimmed = String(url ?? '').trim();
      if (!trimmed || /^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    async function saveDepartment(card) {
      const deptId = card.dataset.deptId;
      const stateEl = document.getElementById(`dept-save-state-${deptId}`);
      const lead = card.querySelector('.dept-lead').value.trim();
      const description = card.querySelector('.dept-description').value.trim();
      const links = [...card.querySelectorAll('.link-row')]
        .map((row) => ({
          label: row.querySelector('.link-label').value.trim(),
          url: normalizeUrl(row.querySelector('.link-url').value),
        }))
        .filter((link) => link.label && link.url);

      stateEl.textContent = 'Saving…';
      stateEl.className = 'save-state';
      try {
        const res = await fetch(`/departments/${deptId}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead: lead || null, description: description || null, links }),
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
        stateEl.textContent = 'Saved ✓';
        stateEl.className = 'save-state ok';
      } catch (err) {
        stateEl.textContent = err.message;
        stateEl.className = 'save-state err';
      }
    }

    async function init() {
      const main = document.getElementById('main');
      let user = null;
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        user = data.user;
      } catch {
        // fall through - treated as signed out below
      }

      const footer = document.getElementById('sidebarFooter');
      if (user) {
        document.getElementById('userName').textContent = user.name || 'Account';
        document.getElementById('userAvatar').textContent = initials(user.name);
        footer.href = '/settings';
      } else {
        document.getElementById('userName').textContent = 'Sign In';
        footer.href = '/auth/google';
      }

      if (!user || !user.is_admin) {
        main.innerHTML = `
          <div class="denied">
            <p>You don't have access to the admin portal.</p>
            <p style="margin-top: 8px;"><a href="/dashboard">Go to my dashboard</a></p>
          </div>
        `;
        return;
      }

      currentUser = user;

      main.innerHTML = `
        <h1 class="page-title">Admin Portal</h1>
        <p class="page-subtitle">Assign departments, edit the company directory, and manage team pages.</p>

        <div class="section">
          <div class="section-heading">Users &amp; Directory</div>
          <div class="card table-scroll">
            <table>
              <thead><tr><th>User</th><th>Department</th><th>Directory Info</th><th>Admin</th><th></th></tr></thead>
              <tbody id="usersTbody"></tbody>
            </table>
          </div>
        </div>

        <div class="section">
          <div class="section-heading">Team Pages</div>
          <div class="dept-grid" id="deptGrid"></div>
        </div>
      `;

      await loadDepartments();
      renderDepartments();
      await loadUsers();
    }

    init();
  </script>
</body>
</html>
