<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts — CODEX</title>
<link rel="icon" type="image/png" href="/icons/CODEX Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2d2b2e;
    --sidebar-bg: rgba(0, 0, 0, 0.24);
    --border: rgba(255, 255, 255, 0.12);
    --text-dim: rgba(255, 255, 255, 0.55);
    --text-faint: rgba(255, 255, 255, 0.35);
    --accent: #2e5266;
    --tag: #e96d2d;
    --card-bg: #cac8bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ffffff;
    min-height: 100vh;
  }

  a { color: inherit; }
  button { font-family: inherit; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; }

  /* ---------- layout ---------- */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 252px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    text-decoration: none;
    color: inherit;
  }

  .sidebar-brand img { width: 32px; height: 32px; object-fit: contain; }
  .sidebar-brand span { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 0 20px; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

  .sidebar-section-label {
    padding: 18px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }

  .category-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    cursor: pointer;
  }

  .category-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .category-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; font-weight: 500; }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .sidebar-footer:hover { background: rgba(255, 255, 255, 0.05); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .user-name { font-size: 14px; font-weight: 500; }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 36px 40px 56px;
    max-width: 1280px;
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .page-title { font-size: 26px; font-weight: 600; }
  .page-subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  .toolbar { margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

  .search-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border-radius: 12px;
    padding: 12px 16px;
    flex: 1;
    max-width: 420px;
  }

  .search-input-wrap .icon { color: rgba(0, 0, 0, 0.45); }

  .search-input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    color: #1e1e1e;
  }

  .dept-filter {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 12px;
    padding: 0 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  .contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .contact-card {
    background: var(--card-bg);
    color: #1e1e1e;
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }

  .contact-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .contact-top .avatar { width: 44px; height: 44px; font-size: 16px; background: var(--accent); }
  .contact-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .contact-title { font-size: 12px; color: #555555; margin-top: 2px; }

  .contact-depts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

  .tag {
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--tag);
    color: #1e1e1e;
  }

  .contact-fields { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; flex: 1; }

  .contact-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #333333;
    text-decoration: none;
    min-width: 0;
  }

  .contact-field .icon { width: 14px; height: 14px; color: #555555; }
  .contact-field span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.contact-field:hover { color: var(--accent); text-decoration: underline; }

  .contact-actions { display: flex; gap: 8px; }

  .action-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(45, 43, 46, 0.45);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    cursor: pointer;
  }

  .action-btn .icon { width: 12px; height: 12px; flex-shrink: 0; }
  .action-btn:hover { background: rgba(45, 43, 46, 0.65); }

  .action-btn-slack { background: #4a154b; }
  .action-btn-slack:hover { background: #611f69; }

  .empty-state {
    text-align: center;
    color: var(--text-faint);
    padding: 60px 0;
    font-size: 14px;
  }

  .denied { margin: 60px auto; text-align: center; color: var(--text-faint); font-size: 14px; }
  .denied a { color: #7eb8d4; text-decoration: underline; }

  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main { padding: 28px 20px 48px; }
    .search-input-wrap { max-width: none; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-brand" href="/">
        <img src="/icons/CODEX - 48PX.png" alt="">
        <span>CODEX</span>
      </a>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          Dashboard
        </a>
        <a class="nav-item" href="/saved">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          </span>
          Saved
        </a>
        <a class="nav-item active" href="/contacts">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          Contacts
        </a>
      </nav>

      <div class="sidebar-section-label">Categories</div>
      <nav class="category-list" id="categoryList" aria-label="Categories"></nav>

      <a class="category-item" href="/admin" id="adminLink" style="display: none;">Admin Portal</a>

      <a class="sidebar-footer" href="/settings" id="sidebarFooter">
        <div class="avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">Loading…</span>
      </a>
    </aside>

    <main class="main" id="main">
      <p class="empty-state">Loading…</p>
    </main>
  </div>

  <script>
    const ICONS = {
      mail: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>',
      phone: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>',
      extension: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>',
      slack: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 15a2 2 0 1 1-2-2h2v2zm1 0a2 2 0 1 1 4 0v5a2 2 0 1 1-4 0v-5zM9 6a2 2 0 1 1 2-2v2H9zm0 1a2 2 0 1 1 0 4H4a2 2 0 1 1 0-4h5zm9 2a2 2 0 1 1 2 2h-2V9zm-1 0a2 2 0 1 1-4 0V4a2 2 0 1 1 4 0v5zm-2 9a2 2 0 1 1-2 2v-2h2zm0-1a2 2 0 1 1 0-4h5a2 2 0 1 1 0 4h-5z"></path></svg>',
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function initials(name) {
      const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts[1]?.[0] ?? '')).toUpperCase();
    }

    function displayName(user) {
      return user.display_name || user.name || user.email;
    }

    // A bare "myworkspace.slack.com/team/U0123" has no scheme, so a browser
    // resolves it as a path relative to this page instead of treating it as
    // an external site - assume https:// unless a scheme is already present.
    function normalizeUrl(url) {
      const trimmed = String(url ?? '').trim();
      if (!trimmed || /^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    let allContacts = [];
    let departments = [];
    let currentUser = null;
    let activeDept = '';

    async function loadUser() {
      const footer = document.getElementById('sidebarFooter');
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.user) throw new Error('not signed in');
        currentUser = data.user;
        document.getElementById('userName').textContent = displayName(currentUser);
        document.getElementById('userAvatar').textContent = initials(displayName(currentUser));
        document.getElementById('adminLink').style.display = currentUser.is_admin ? 'block' : 'none';
        footer.href = '/settings';
        return true;
      } catch {
        document.getElementById('userName').textContent = 'Sign In';
        document.getElementById('userAvatar').textContent = '?';
        footer.href = '/auth/google';
        return false;
      }
    }

    async function loadSidebarCategories() {
      const categoryList = document.getElementById('categoryList');
      if (!categoryList) return;
      try {
        const res = await fetch('/departments');
        if (!res.ok) throw new Error('Failed to load departments');
        const departments = await res.json();
        categoryList.innerHTML = departments.map((d) => `<a class="category-item" href="/team/${encodeURIComponent(d.name)}">${escapeHtml(d.name)}</a>`).join('');
      } catch (err) {
        console.error('[sidebar] failed to load categories:', err);
      }
    }

    function contactCardHtml(person) {
      const name = displayName(person);
      const depts = Array.isArray(person.departments) ? person.departments : [];
      return `
        <article class="contact-card">
          <div class="contact-top">
            <div class="avatar">${escapeHtml(initials(name))}</div>
            <div>
              <div class="contact-name">${escapeHtml(name)}</div>
              ${person.title ? `<div class="contact-title">${escapeHtml(person.title)}</div>` : ''}
            </div>
          </div>
          ${depts.length > 0 ? `<div class="contact-depts">${depts.map((d) => `<span class="tag">${escapeHtml(d)}</span>`).join('')}</div>` : ''}
          <div class="contact-fields">
            <a class="contact-field" href="mailto:${escapeHtml(person.email)}">${ICONS.mail}<span>${escapeHtml(person.email)}</span></a>
            ${person.phone ? `<a class="contact-field" href="tel:${escapeHtml(person.phone)}">${ICONS.phone}<span>${escapeHtml(person.phone)}</span></a>` : ''}
            ${person.extension ? `<a class="contact-field" href="tel:${escapeHtml(person.extension)}">${ICONS.extension}<span>Ext. ${escapeHtml(person.extension)}</span></a>` : ''}
          </div>
          <div class="contact-actions">
            ${person.slack_url
              ? `<a class="action-btn action-btn-slack" href="${escapeHtml(normalizeUrl(person.slack_url))}" target="_blank" rel="noopener">${ICONS.slack} MESSAGE IN SLACK</a>`
              : `<a class="action-btn" href="mailto:${escapeHtml(person.email)}">${ICONS.mail} EMAIL</a>`}
          </div>
        </article>
      `;
    }

    function renderGrid() {
      const main = document.getElementById('main');
      const grid = document.getElementById('contactGrid');
      if (!grid) return;

      const term = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allContacts.filter((person) => {
        const matchesDept = !activeDept || (person.departments || []).includes(activeDept);
        const matchesTerm = !term
          || displayName(person).toLowerCase().includes(term)
          || person.email?.toLowerCase().includes(term)
          || person.title?.toLowerCase().includes(term);
        return matchesDept && matchesTerm;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-state">No contacts match your search yet.</p>';
        return;
      }

      grid.innerHTML = filtered
        .slice()
        .sort((a, b) => displayName(a).localeCompare(displayName(b)))
        .map(contactCardHtml)
        .join('');
    }

    function renderPage() {
      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="main-header">
          <div>
            <h1 class="page-title">Contacts</h1>
            <p class="page-subtitle">Everyone at the company, in one place.</p>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="search" id="searchInput" placeholder="Search by name, title, or email" aria-label="Search contacts">
          </div>
          <select class="dept-filter" id="deptFilter" aria-label="Filter by department">
            <option value="">All Departments</option>
            ${departments.map((d) => `<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('')}
          </select>
        </div>

        <div id="contactGrid" class="contact-grid"></div>
      `;

      document.getElementById('searchInput').addEventListener('input', renderGrid);
      document.getElementById('deptFilter').addEventListener('change', (e) => {
        activeDept = e.target.value;
        renderGrid();
      });

      renderGrid();
    }

    async function loadContacts() {
      try {
        const [usersRes, deptsRes] = await Promise.all([
          fetch('/users', { credentials: 'include' }),
          fetch('/departments', { credentials: 'include' }),
        ]);
        if (!usersRes.ok) throw new Error('Failed to load contacts');
        allContacts = await usersRes.json();
        departments = deptsRes.ok ? await deptsRes.json() : [];
        renderPage();
      } catch (err) {
        console.error('[contacts] failed to load contacts:', err);
        document.getElementById('main').innerHTML = '<p class="empty-state">Could not load contacts right now.</p>';
      }
    }

    async function init() {
      const main = document.getElementById('main');
      const signedIn = await loadUser();
      if (!signedIn) {
        main.innerHTML = `
          <div class="denied">
            <p>You need to be signed in to view the company directory.</p>
            <p style="margin-top: 8px;"><a href="/auth/google">Sign in</a></p>
          </div>
        `;
        return;
      }
      loadContacts();
    }

    init();
    loadSidebarCategories();
  </script>
</body>
</html>
