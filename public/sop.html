<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP — CODEX</title>
  <link rel="icon" type="image/png" href="/icons/CODEX - 48PX.png">
  <script src="/markdown.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
   
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #2d2b2e;
      color: #fff;
      min-height: 100vh;
      padding: 48px 24px;
    }
    header {
      max-width: 800px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      
    }
    .brand-icon {
      width: 32px;
      height: 32px;
    }
    .back-link {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
    }
    .back-link:hover { color: #fff; }
    .main {
      max-width: 800px;
      margin: 0 auto;
    }
    .sop-header {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px 30px;
      margin-bottom: 32px;
    }
    .sop-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.25;
    }
    .sop-description {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .sop-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
    }
    .meta-value {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .meta-value a {
      color: #7eb8d4;
      text-decoration: none;
    }
    .meta-value a:hover { text-decoration: underline; }
    .sop-author {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 18px;
    }
    .steps-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }
    .step {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .step-info {
      padding: 16px 20px 14px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .step-number {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.25);
      flex-shrink: 0;
    }
    .step-description {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
    }
    .step-screenshot {
      width: 100%;
      display: block;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .empty {
      text-align: center;
      color: rgba(255,255,255,0.4);
      margin-top: 80px;
      font-size: 15px;
    }
    .doc-content {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255,255,255,0.85);
    }
    .doc-content h1, .doc-content h2, .doc-content h3,
    .doc-content h4, .doc-content h5, .doc-content h6 {
      margin: 22px 0 10px;
      line-height: 1.35;
      color: #fff;
    }
    .doc-content h1:first-child, .doc-content h2:first-child, .doc-content h3:first-child { margin-top: 0; }
    .doc-content h1 { font-size: 24px; font-weight: 800; }
    .doc-content h2 { font-size: 20px; font-weight: 700; }
    .doc-content h3 { font-size: 17px; font-weight: 700; }
    .doc-content p { margin: 0 0 14px; }
    .doc-content ul, .doc-content ol { margin: 0 0 14px; padding-left: 24px; }
    .doc-content li { margin-bottom: 6px; }
    .doc-content strong { color: #fff; font-weight: 700; }
    .doc-content code {
      background: rgba(0,0,0,0.35);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .doc-content pre {
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0 0 14px;
    }
    .doc-content pre code { background: none; padding: 0; }
    .doc-content blockquote {
      border-left: 3px solid rgba(233,109,45,0.6);
      padding: 2px 16px;
      margin: 0 0 14px;
      color: rgba(255,255,255,0.65);
    }
    .doc-content a { color: #7eb8d4; }
    .doc-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 20px 0; }
    .doc-content img { max-width: 100%; border-radius: 8px; margin: 6px 0 14px; display: block; }
  </style>
</head>
<body>
  <header>
    <a href="/"><img class="brand-icon" src="/icons/CODEX - 48PX.png" alt="CODEX"></a>
    <a class="back-link" href="/dashboard">← My SOPs</a>
    <a class="back-link" href="#" id="editLink" style="display: none;">Edit</a>
    <a class="back-link" href="/admin" id="adminLink" style="display: none;">Admin Portal</a>
  </header>

  <div class="main" id="main">
    <p class="empty">Loading…</p>
  </div>

  <script>
    function escape(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let currentSop = null;
    let currentUserId = null;

    function updateEditLink() {
      const editLink = document.getElementById('editLink');
      if (currentSop && currentSop.doc_type === 'document' && currentUserId != null && currentSop.user_id === currentUserId) {
        editLink.href = `/documents/new?id=${currentSop.id}`;
        editLink.style.display = 'inline';
      }
    }

    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      const main = document.getElementById('main');

      if (!id) {
        main.innerHTML = '<p class="empty">No SOP ID provided.</p>';
        return;
      }

      let sop;
      try {
        let res = await fetch(`/sops/${id}`);
        // Anonymous visitor (no session) - fall back to the public-only view.
        if (res.status === 401) res = await fetch(`/sops/public/${id}`, { credentials: 'omit' });
        if (!res.ok) throw new Error('Not found');
        sop = await res.json();
      } catch {
        main.innerHTML = '<p class="empty">SOP not found.</p>';
        return;
      }

      currentSop = sop;
      updateEditLink();

      document.title = `${sop.title} — CODEX`;

      const date = sop.created_at
        ? new Date(sop.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        : '';

      const isDocument = sop.doc_type === 'document';
      const steps = Array.isArray(sop.steps) ? sop.steps : [];

      const bodyHtml = isDocument
        ? `<div class="doc-content">${CodexMarkdown.renderMarkdown(sop.content || '')}</div>`
        : `${steps.length > 0 ? `<div class="steps-heading">${steps.length} step${steps.length === 1 ? '' : 's'}</div>` : ''}
           ${steps.length === 0
             ? '<p class="empty" style="margin-top:24px">No steps recorded.</p>'
             : steps.map((step, i) => `
              <div class="step">
                <div class="step-info">
                  <span class="step-number">Step ${i + 1}</span>
                  <span class="step-description">${escape(step.description || step.title || '')}</span>
                </div>
                ${step.screenshot || step.screenshot_base64
                  ? `<img class="step-screenshot" src="data:image/png;base64,${step.screenshot || step.screenshot_base64}" alt="Step ${i + 1} screenshot">`
                  : ''}
              </div>
            `).join('')}`;

      main.innerHTML = `
        <div class="sop-header">
          <div class="sop-title">${escape(sop.title)}</div>
          ${sop.description ? `<div class="sop-description">${escape(sop.description)}</div>` : ''}
          <div class="sop-author">By ${escape(sop.author || 'Unknown')}</div>
          <div class="sop-meta">
            <div class="meta-item"><span class="meta-label">Author</span><span class="meta-value">${escape(sop.author || 'Unknown')}</span></div>
            ${date ? `<div class="meta-item"><span class="meta-label">Created</span><span class="meta-value">${date}</span></div>` : ''}
            ${sop.url ? `<div class="meta-item"><span class="meta-label">Source</span><span class="meta-value"><a href="${escape(sop.url)}" target="_blank" rel="noopener">${escape(sop.url)}</a></span></div>` : ''}
          </div>
        </div>
        ${bodyHtml}
      `;
    }

    async function loadAdminLink() {
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        document.getElementById('adminLink').style.display = data.user?.is_admin ? 'inline' : 'none';
        currentUserId = data.user?.id ?? null;
        updateEditLink();
      } catch {
        // not signed in / request failed - leave the admin link hidden
      }
    }

    load();
    loadAdminLink();
  </script>
</body>
</html>
