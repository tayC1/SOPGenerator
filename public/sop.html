<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP — CODEX</title>
  <link rel="icon" type="image/png" href="/icons/CODEX - 48PX.png">
  <script src="/markdown.js"></script>
  <script src="/saved.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: #2d2b2e; }

    body {
      font-family: Inter, -apple-system, sans-serif;
      color: #fff;
      min-height: 100vh;
    }

    a { color: inherit; }
    button { font-family: inherit; }

    .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .icon svg { width: 100%; height: 100%; }

    /* ---------- layout ---------- */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- sidebar ---------- */
    .sidebar {
      width: 252px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.24);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px 20px 20px;
      text-decoration: none;
      color: inherit;
    }

    .sidebar-brand img { width: 32px; height: 32px; object-fit: contain; }
    .sidebar-brand span { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }

    .sidebar-divider { height: 1px; background: rgba(255, 255, 255, 0.12); margin: 0 20px; }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 16px 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
    .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .nav-item[aria-disabled="true"] {
      cursor: not-allowed;
      color: rgba(255, 255, 255, 0.35);
    }
    .nav-item[aria-disabled="true"]:hover { background: none; }

    .nav-soon {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 2px 7px;
    }

    .category-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      cursor: pointer;
    }

    .category-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .sidebar-footer:hover { background: rgba(255, 255, 255, 0.05); }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2e5266;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-name { font-size: 14px; font-weight: 500; }

    .back-link {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
    }
    .back-link:hover { color: #fff; }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      margin-bottom: 20px;
    }
    .back-nav:hover { color: #fff; }
    .back-nav svg { width: 16px; height: 16px; }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .pin-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
    }
    .pin-btn:hover { background: rgba(255,255,255,0.1); }
    .pin-btn.is-saved { color: #e96d2d; border-color: rgba(233,109,45,0.4); }
    .pin-btn svg { width: 18px; height: 18px; display: block; }

    /* ---------- main ---------- */
    .main {
      flex: 1;
      min-width: 0;
      padding: 48px 40px 56px;
    }

    @media (max-width: 860px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .main { padding: 28px 20px 48px; }
    }
    .sop-header {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px 30px;
      margin-bottom: 32px;
    }
    .sop-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .sop-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.25;
    }
    .sop-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
    .tag-solid { background: #e96d2d; color: #1e1e1e; }
    .tag-outline { border: 1px solid #e96d2d; color: rgba(255,255,255,0.75); }
    .sop-description {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .sop-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .meta-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
    }
    .meta-value {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .meta-value a {
      color: #7eb8d4;
      text-decoration: none;
    }
    .meta-value a:hover { text-decoration: underline; }
    .sop-author {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 18px;
    }
    .steps-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }
    .step {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .step-info {
      padding: 16px 20px 14px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .step-number {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.25);
      flex-shrink: 0;
    }
    .step-description {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
    }
    .step-screenshot {
      width: 100%;
      display: block;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .step-screenshot-wrap {
      position: relative;
      line-height: 0;
    }
    .step-click-marker {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #e04b2a;
      background: rgba(224,75,42,0.18);
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      pointer-events: none;
    }
    .empty {
      text-align: center;
      color: rgba(255,255,255,0.4);
      margin-top: 80px;
      font-size: 15px;
    }
    .doc-content {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255,255,255,0.85);
    }
    .doc-content h1, .doc-content h2, .doc-content h3,
    .doc-content h4, .doc-content h5, .doc-content h6 {
      margin: 22px 0 10px;
      line-height: 1.35;
      color: #fff;
    }
    .doc-content h1:first-child, .doc-content h2:first-child, .doc-content h3:first-child { margin-top: 0; }
    .doc-content h1 { font-size: 24px; font-weight: 800; }
    .doc-content h2 { font-size: 20px; font-weight: 700; }
    .doc-content h3 { font-size: 17px; font-weight: 700; }
    .doc-content p { margin: 0 0 14px; }
    .doc-content ul, .doc-content ol { margin: 0 0 14px; padding-left: 24px; }
    .doc-content li { margin-bottom: 6px; }
    .doc-content strong { color: #fff; font-weight: 700; }
    .doc-content code {
      background: rgba(0,0,0,0.35);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .doc-content pre {
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0 0 14px;
    }
    .doc-content pre code { background: none; padding: 0; }
    .doc-content blockquote {
      border-left: 3px solid rgba(233,109,45,0.6);
      padding: 2px 16px;
      margin: 0 0 14px;
      color: rgba(255,255,255,0.65);
    }
    .doc-content a { color: #7eb8d4; }
    .doc-content .email-card {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      margin: 0 0 14px;
      overflow: hidden;
    }
    .doc-content .email-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.02);
    }
    .doc-content .email-card-icon { font-size: 18px; line-height: 1; margin-top: 1px; }
    .doc-content .email-card-fields { flex: 1; min-width: 0; }
    .doc-content .email-card-field { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.5; }
    .doc-content .email-card-field + .email-card-field { margin-top: 2px; }
    .doc-content .email-card-label {
      flex-shrink: 0;
      width: 56px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.4);
    }
    .doc-content .email-card-value { color: rgba(255,255,255,0.9); word-break: break-word; }
    .doc-content .email-card-empty { color: rgba(255,255,255,0.35); font-style: italic; }
    .doc-content .email-card-body { padding: 14px 16px; }
    .doc-content .email-card-body p:last-child { margin-bottom: 0; }
    .doc-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 20px 0; }
    .doc-content img { max-width: 100%; border-radius: 8px; margin: 6px 0 14px; display: block; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-brand" href="/">
        <img src="/icons/CODEX - 48PX.png" alt="">
        <span>CODEX</span>
      </a>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          Dashboard
        </a>
        <a class="nav-item" href="/saved">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          </span>
          Saved
        </a>
        <a class="nav-item" href="/contacts">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          Contacts
        </a>
      </nav>

      <a class="category-item" href="/admin" id="adminLink" style="display: none;">Admin Portal</a>

      <a class="sidebar-footer" href="/auth/google" id="sidebarFooter">
        <div class="avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">Sign In</span>
      </a>
    </aside>

    <main class="main">
      <a class="back-nav" href="/dashboard" id="backLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </a>
      <div id="main">
        <p class="empty">Loading…</p>
      </div>
    </main>
  </div>

  <script>
    function escape(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let currentSop = null;
    let currentUserId = null;

    function updateEditLink() {
      const editLink = document.getElementById('editLink');
      if (!editLink) return;
      if (currentSop && currentSop.doc_type === 'document' && currentUserId != null && currentSop.user_id === currentUserId) {
        editLink.href = `/documents/new?id=${currentSop.id}`;
        editLink.style.display = 'inline';
      }
    }

    function updatePinButton() {
      const pinBtn = document.getElementById('pinBtn');
      if (!pinBtn || !currentSop || currentUserId == null) return;
      pinBtn.style.display = 'inline-flex';
      const saved = CodexSaved.isSaved(currentSop.id);
      pinBtn.classList.toggle('is-saved', saved);
      pinBtn.innerHTML = CodexSaved.icon(currentSop.id);
      pinBtn.title = saved ? 'Remove from Saved' : 'Save';
      pinBtn.setAttribute('aria-label', pinBtn.title);
      pinBtn.onclick = async () => {
        pinBtn.disabled = true;
        try {
          await CodexSaved.toggle(currentSop.id);
          updatePinButton();
        } catch {
          alert('Could not update the saved state right now.');
        } finally {
          pinBtn.disabled = false;
        }
      };
    }

    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      const main = document.getElementById('main');

      if (!id) {
        main.innerHTML = '<p class="empty">No SOP ID provided.</p>';
        return;
      }

      let sop;
      try {
        let res = await fetch(`/sops/${id}`);
        // Anonymous visitor (no session) - fall back to the public-only view.
        if (res.status === 401) res = await fetch(`/sops/public/${id}`, { credentials: 'omit' });
        if (!res.ok) throw new Error('Not found');
        sop = await res.json();
      } catch {
        main.innerHTML = '<p class="empty">SOP not found.</p>';
        return;
      }

      currentSop = sop;

      document.title = `${sop.title} — CODEX`;

      const date = sop.created_at
        ? new Date(sop.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        : '';

      const isDocument = sop.doc_type === 'document';
      const steps = Array.isArray(sop.steps) ? sop.steps : [];

      const bodyHtml = isDocument
        ? `<div class="doc-content">${CodexMarkdown.renderMarkdown(sop.content || '')}</div>`
        : `${steps.length > 0 ? `<div class="steps-heading">${steps.length} step${steps.length === 1 ? '' : 's'}</div>` : ''}
           ${steps.length === 0
             ? '<p class="empty" style="margin-top:24px">No steps recorded.</p>'
             : steps.map((step, i) => `
              <div class="step">
                <div class="step-info">
                  <span class="step-number">Step ${i + 1}</span>
                  <span class="step-description">${escape(step.description || step.title || '')}</span>
                </div>
                ${step.screenshot || step.screenshot_base64
                  ? `<div class="step-screenshot-wrap">
                      <img class="step-screenshot" src="data:image/png;base64,${step.screenshot || step.screenshot_base64}" alt="Step ${i + 1} screenshot">
                      ${step.clickX != null && step.clickY != null
                        ? `<div class="step-click-marker" style="left:${step.clickX * 100}%;top:${step.clickY * 100}%;"></div>`
                        : ''}
                     </div>`
                  : ''}
              </div>
            `).join('')}`;

      main.innerHTML = `
        <div class="sop-header">
          <div class="sop-header-top">
            <div class="sop-title">${escape(sop.title)}</div>
            <div class="header-actions">
              <button class="pin-btn" type="button" id="pinBtn" style="display: none;" title="Save" aria-label="Save"></button>
              <a class="back-link" href="#" id="editLink" style="display: none;">Edit</a>
            </div>
          </div>
          <div class="sop-tags">
            <span class="tag tag-solid">${escape(sop.category || 'Uncategorized')}</span>
            <span class="tag tag-outline">${isDocument ? 'Document' : 'SOP'}</span>
            ${sop.tag ? `<span class="tag tag-outline">${escape(sop.tag)}</span>` : ''}
          </div>
          ${sop.description ? `<div class="sop-description">${escape(sop.description)}</div>` : ''}
          <div class="sop-author">By ${escape(sop.author || 'Unknown')}</div>
          <div class="sop-meta">
            <div class="meta-item"><span class="meta-label">Author</span><span class="meta-value">${escape(sop.author || 'Unknown')}</span></div>
            ${date ? `<div class="meta-item"><span class="meta-label">Created</span><span class="meta-value">${date}</span></div>` : ''}
            ${sop.url ? `<div class="meta-item"><span class="meta-label">Source</span><span class="meta-value"><a href="${escape(sop.url)}" target="_blank" rel="noopener">${escape(sop.url)}</a></span></div>` : ''}
          </div>
        </div>
        ${bodyHtml}
      `;
      updateEditLink();
      updatePinButton();
    }

    function initials(name) {
      const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts[1]?.[0] ?? '')).toUpperCase();
    }

    async function loadUser() {
      const footer = document.getElementById('sidebarFooter');
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        document.getElementById('adminLink').style.display = data.user?.is_admin ? 'block' : 'none';
        currentUserId = data.user?.id ?? null;
        if (data.user) {
          document.getElementById('userName').textContent = data.user.name || 'Account';
          document.getElementById('userAvatar').textContent = initials(data.user.name);
          footer.href = '/settings';
          await CodexSaved.load();
        }
        updateEditLink();
        updatePinButton();
      } catch {
        // not signed in / request failed - leave the sidebar in its signed-out state
      }
    }

    // Prefer real browser back navigation (returns to the exact scroll
    // position / search state of whatever list page sent you here, via
    // bfcache) over a fixed link. Falls back to the referrer, or /dashboard
    // if this page was opened directly (no history to go back to).
    function initBackLink() {
      const backLink = document.getElementById('backLink');
      const ref = document.referrer;
      let sameOriginRef = null;
      try {
        if (ref && new URL(ref).origin === location.origin) sameOriginRef = ref;
      } catch {}
      backLink.href = sameOriginRef || '/dashboard';
      backLink.addEventListener('click', (e) => {
        if (history.length > 1) {
          e.preventDefault();
          history.back();
        }
      });
    }

    initBackLink();
    load();
    loadUser();
  </script>
</body>
</html>
