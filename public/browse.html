<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse SOPs — CODEX</title>
<link rel="icon" type="image/png" href="/icons/CODEX - 48PX.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/saved.js"></script>
<style>
  :root {
    --bg: #2d2b2e;
    --sidebar-bg: rgba(0, 0, 0, 0.24);
    --border: rgba(255, 255, 255, 0.12);
    --text-dim: rgba(255, 255, 255, 0.55);
    --text-faint: rgba(255, 255, 255, 0.35);
    --accent: #2e5266;
    --tag: #e96d2d;
    --card-bg: #cac8bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #ffffff;
    min-height: 100vh;
  }

  a { color: inherit; }
  button { font-family: inherit; }

  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; }

  /* ---------- layout ---------- */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 252px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 20px 20px;
    text-decoration: none;
    color: inherit;
  }

  .sidebar-brand img { width: 32px; height: 32px; object-fit: contain; }
  .sidebar-brand span { font-size: 22px; font-weight: 500; letter-spacing: 0.02em; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 0 20px; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .nav-item[aria-disabled="true"] {
    cursor: not-allowed;
    color: var(--text-faint);
  }
  .nav-item[aria-disabled="true"]:hover { background: none; }

  .nav-soon {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 7px;
  }

  .category-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    cursor: pointer;
  }

  .category-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .sidebar-footer:hover { background: rgba(255, 255, 255, 0.05); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .user-name { font-size: 14px; font-weight: 500; }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    padding: 36px 40px 56px;
    max-width: 1280px;
  }

  .page-title { margin: 0 0 28px; font-size: 28px; font-weight: 600; }

  .sop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }

  .sop-card {
    background: var(--card-bg);
    color: #1e1e1e;
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .pin-corner {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: rgba(45, 43, 46, 0.45);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .pin-corner:hover { background: rgba(45, 43, 46, 0.65); }
  .pin-corner.is-saved { color: var(--tag); }
  .pin-corner .icon { width: 14px; height: 14px; }

  .sop-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; padding-right: 34px; }

  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--tag);
    color: #1e1e1e;
  }

  .tag-outline { border: 1px solid var(--tag); background: transparent; color: #2d2b2e; }

  .sop-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
  .sop-title a { color: inherit; text-decoration: none; }
  .sop-title a:hover { text-decoration: underline; }

  .sop-desc {
    font-size: 12px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 14px;
    flex: 1;
  }

  .sop-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    padding-top: 10px;
    margin-bottom: 12px;
  }

  .sop-author { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sop-author .avatar { width: 20px; height: 20px; font-size: 10px; background: #d4d4d4; color: #1e1e1e; }
  .sop-author span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sop-steps { flex-shrink: 0; color: var(--accent); font-weight: 600; }

  .sop-card-actions { display: flex; gap: 8px; }

  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    background: rgba(45, 43, 46, 0.45);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    cursor: pointer;
  }

  .action-btn:hover { background: rgba(45, 43, 46, 0.65); }


  .empty-state {
    text-align: center;
    color: var(--text-faint);
    padding: 60px 0;
    font-size: 14px;
  }

  @media (max-width: 860px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; }
    .main { padding: 28px 20px 48px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-brand" href="/">
        <img src="/icons/CODEX - 48PX.png" alt="">
        <span>CODEX</span>
      </a>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          Dashboard
        </a>
        <a class="nav-item" href="/saved">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          </span>
          Saved
        </a>
        <a class="nav-item" href="/contacts">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          Contacts
        </a>
      </nav>

      <a class="category-item" href="/admin" id="adminLink" style="display: none;">Admin Portal</a>

      <a class="sidebar-footer" href="/auth/google" id="sidebarFooter">
        <div class="avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">Sign In</span>
      </a>
    </aside>

    <main class="main">
      <h1 class="page-title">Browse SOPs</h1>

      <div id="grid">
        <p class="empty-state">Loading SOPs…</p>
      </div>
    </main>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function initials(name) {
      const parts = String(name ?? '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '?';
      return (parts[0][0] + (parts[1]?.[0] ?? '')).toUpperCase();
    }

    function formatDate(value) {
      if (!value) return '';
      return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    let allSops = [];
    // Pin button only shows once we know the visitor is signed in (browse
    // is otherwise fully anonymous) - see sopCardHtml.
    let signedIn = false;

    function sopCardHtml(sop) {
      const stepCount = Array.isArray(sop.steps) ? sop.steps.length : null;
      const isDocument = sop.doc_type === 'document';
      const pinBtn = signedIn
        ? `<button class="pin-corner${CodexSaved.isSaved(sop.id) ? ' is-saved' : ''}" type="button" data-pin="${sop.id}" title="${CodexSaved.isSaved(sop.id) ? 'Remove from Saved' : 'Save'}" aria-label="${CodexSaved.isSaved(sop.id) ? 'Remove from Saved' : 'Save'}">${CodexSaved.icon(sop.id)}</button>`
        : '';
      return `
        <article class="sop-card">
          ${pinBtn}
          <div class="sop-tags">
            <span class="tag">${escapeHtml(sop.category || 'Uncategorized')}</span>
            <span class="tag tag-outline">${isDocument ? 'Document' : 'SOP'}</span>
            ${sop.tag ? `<span class="tag tag-outline">${escapeHtml(sop.tag)}</span>` : ''}
          </div>
          <h2 class="sop-title"><a href="/sop.html?id=${sop.id}">${escapeHtml(sop.title)}</a></h2>
          <p class="sop-desc">${escapeHtml(sop.description || 'No description provided.')}</p>
          <div class="sop-meta">
            <div class="sop-author">
              <span class="avatar">${escapeHtml(initials(sop.author))}</span>
              <span>${escapeHtml(sop.author || 'Unknown')} · ${formatDate(sop.created_at)}</span>
            </div>
            ${stepCount != null ? `<span class="sop-steps">${stepCount} step${stepCount === 1 ? '' : 's'}</span>` : ''}
          </div>
          <div class="sop-card-actions">
            <a class="action-btn" href="/sop.html?id=${sop.id}">View SOP</a>
          </div>
        </article>
      `;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      if (allSops.length === 0) {
        grid.innerHTML = '<p class="empty-state">No SOPs published yet.</p>';
        return;
      }
      grid.innerHTML = `<div class="sop-grid">${allSops.map(sopCardHtml).join('')}</div>`;
      grid.querySelectorAll('[data-pin]').forEach((btn) => {
        btn.addEventListener('click', () => togglePin(btn));
      });
    }

    async function togglePin(btn) {
      const id = btn.dataset.pin;
      btn.disabled = true;
      try {
        const saved = await CodexSaved.toggle(id);
        btn.classList.toggle('is-saved', saved);
        btn.innerHTML = CodexSaved.icon(id);
        btn.title = saved ? 'Remove from Saved' : 'Save';
        btn.setAttribute('aria-label', btn.title);
      } catch {
        alert('Could not update the saved state right now.');
      } finally {
        btn.disabled = false;
      }
    }

    async function load() {
      const grid = document.getElementById('grid');
      try {
        // Public, unauthenticated view - only SOPs explicitly marked public
        // (see routes/sops.js's GET /public).
        const res = await fetch('/sops/public', { credentials: 'omit' });
        if (!res.ok) throw new Error('Failed to load');
        allSops = await res.json();
        renderGrid();
      } catch {
        grid.innerHTML = '<p class="empty-state">Failed to load SOPs.</p>';
      }
    }

    async function loadUser() {
      const footer = document.getElementById('sidebarFooter');
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.user) throw new Error('not signed in');
        document.getElementById('adminLink').style.display = data.user.is_admin ? 'block' : 'none';
        document.getElementById('userName').textContent = data.user.name || 'Account';
        document.getElementById('userAvatar').textContent = initials(data.user.name);
        footer.href = '/settings';
        signedIn = true;
        await CodexSaved.load();
        renderGrid();
      } catch {
        // not signed in / request failed - leave the sidebar in its signed-out state
      }
    }

    load();
    loadUser();
  </script>
</body>
</html>
